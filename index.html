<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Link Decoder</title>
    <style>
        /* 
         * 1. GLOBAL STYLES & PRE-WRAP
         * white-space: pre-wrap ensures ALL spaces, double spaces, 
         * and line breaks are strictly preserved exactly as typed.
         */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            white-space: pre-wrap; 
        }

        /* 
         * 2. BODY BACKGROUND (Milky White)
         * A very soft, creamy/milky gradient background 
         */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #f0f0f0; /* Milky text color for elements inside the dark panel */
        }

        /* 
         * 3. MAIN GLASS PANEL (Dark Glass / Black)
         * Frosted black glass sitting on the milky background 
         * Uses Neumorphic shadows to pop off the white background
         */
        .glass-panel {
            width: 90%;
            max-width: 680px;
            padding: 45px;
            border-radius: 28px;
            
            /* Dark Glassmorphism */
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            
            /* Neumorphic shadow interacting with the white body */
            box-shadow: 
                15px 15px 35px rgba(0, 0, 0, 0.15), 
                -15px -15px 35px rgba(255, 255, 255, 0.8);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 35px;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
        }

        /* 
         * 4. INPUT FIELDS (Carved out screens)
         * Deep inset shadows to look like physical, carved-out black screens
         */
        .input-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            outline: none;
            background: rgba(0, 0, 0, 0.6); /* Deep black */
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            
            /* Skeuomorphic inset depth */
            box-shadow: 
                inset 6px 6px 15px rgba(0, 0, 0, 0.9), 
                inset -6px -6px 15px rgba(255, 255, 255, 0.05);
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* 
         * 5. BUTTONS (Tactile Neumorphism)
         */
        button {
            padding: 14px 28px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            color: #fdfbfb;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            /* Raised button shadow */
            box-shadow: 
                6px 6px 14px rgba(0, 0, 0, 0.6), 
                -4px -4px 10px rgba(255, 255, 255, 0.05);
        }

        button:hover {
            background: linear-gradient(145deg, #333, #222);
            color: #ffffff;
        }

        button:active {
            /* Pressed physical button state */
            background: #151515;
            box-shadow: 
                inset 5px 5px 10px rgba(0, 0, 0, 0.8), 
                inset -5px -5px 10px rgba(255, 255, 255, 0.03);
            transform: translateY(2px);
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
        }

        /* 
         * 6. OUTPUT & ERROR SECTIONS 
         */
        #output-section {
            display: none;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-text {
            color: #ff4757;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
            background: rgba(255, 71, 87, 0.1);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 71, 87, 0.3);
            margin-top: 20px;
            display: none;
        }

    </style>
</head>
<body>

    <div class="glass-panel">
        <h2> URL  Decoder  &  Cleaner </h2>

        <!-- Input Area -->
        <div class="input-group">
            <textarea id="input-url" placeholder="Paste  your  URL  or  cURL  command  here..."></textarea>
            <div class="action-row">
                <button id="btn-paste"> Paste  &  Decode </button>
            </div>
        </div>

        <!-- Error Notification -->
        <div id="error-msg" class="error-text"> URL  Not  Supported </div>

        <!-- Output Area (Hidden until success) -->
        <div id="output-section">
            <div class="input-group">
                <textarea id="output-url" readonly placeholder="Cleaned  link  will  appear  here..."></textarea>
                <div class="action-row">
                    <button id="btn-copy"> Copy  Modified  Link </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Element Selection
        const inputField = document.getElementById('input-url');
        const outputField = document.getElementById('output-url');
        const outputSection = document.getElementById('output-section');
        const errorMsg = document.getElementById('error-msg');
        const pasteBtn = document.getElementById('btn-paste');
        const copyBtn = document.getElementById('btn-copy');

        /**
         * Core processing logic to handle raw URLs OR full cURL commands.
         * Scans for multiple nested URLs and finds the correct .mpd manifest.
         */
        function processUrl(rawInput) {
            try {
                let targetString = rawInput.trim();
                let workingUrl = targetString;

                // 1. EXTRACT URL FROM CURL
                // If the user pasted a full curl command, use regex to grab the first http/https link
                const curlRegex = /(https?:\/\/[^\s'"]+)/;
                const match = targetString.match(curlRegex);
                if (match) {
                    workingUrl = match[1]; // Overwrite with just the URL portion
                }

                // 2. PROCESS WEB PLAYER WRAPPER (drm?url=...)
                // We check if it's the wrapped format containing URL-encoded payloads
                if (workingUrl.includes('drm?url=')) {
                    const parsedUrl = new URL(workingUrl);
                    
                    // CRITICAL FIX: Use .getAll() instead of .get()
                    // The curl command contains multiple 'url=' parameters (init.mp4 AND master.mpd).
                    // .getAll() returns an array of ALL of them so we can check both.
                    const nestedUrls = parsedUrl.searchParams.getAll('url');
                    
                    if (nestedUrls.length === 0) throw new Error("No payload found");

                    let manifestFound = false;

                    // Loop through every nested URL we found
                    for (let i = 0; i < nestedUrls.length; i++) {
                        let decoded = decodeURIComponent(nestedUrls[i]);
                        
                        // We strictly want the one that is a master manifest (.mpd or .m3u8)
                        if (decoded.includes('.mpd') || decoded.includes('.m3u8')) {
                            workingUrl = decoded;
                            manifestFound = true;
                            break; // Stop looking once we find the manifest
                        }
                    }

                    // Fallback: If we somehow didn't find an mpd/m3u8, just use the first decoded link
                    if (!manifestFound) {
                        workingUrl = decodeURIComponent(nestedUrls[0]);
                    }
                }

                // 3. FINAL VERIFICATION & CLEANUP
                // Ensure it is a CloudFront link and an actual streaming manifest
                if (workingUrl.includes('cloudfront.net') && (workingUrl.includes('.mpd') || workingUrl.includes('.m3u8'))) {
                    
                    // Clean the CloudFront Signature corruption
                    let cleanedUrl = workingUrl
                        .replace(/__&/g, '&')  
                        .replace(/_&/g, '&')   
                        .replace(/__$/g, '')   
                        .replace(/_$/g, '');   

                    return cleanedUrl;
                } else {
                    return null; // Fails verification, trigger "Not Supported"
                }
            } catch (error) {
                console.error("Logic processing error:", error);
                return null;
            }
        }

        /**
         * UI Controller
         * Decides what to show based on whether the URL was successfully processed
         */
        function handleDecode(inputStr) {
            const result = processUrl(inputStr);

            if (result) {
                // Success: Show the dark output panel
                errorMsg.style.display = 'none';
                outputField.value = result;
                outputSection.style.display = 'block';
            } else {
                // Fail: Hide output, show the red error box
                outputSection.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================

        // Listener 1: Real-time typing/pasting detection
        inputField.addEventListener('input', (e) => {
            if(e.target.value.trim() !== "") {
                handleDecode(e.target.value);
            } else {
                // Reset UI if box is cleared
                outputSection.style.display = 'none';
                errorMsg.style.display = 'none';
            }
        });

        // Listener 2: "Paste & Decode" Button Logic
        pasteBtn.addEventListener('click', async () => {
            try {
                // Grabs text directly from the OS clipboard
                const text = await navigator.clipboard.readText();
                inputField.value = text;
                handleDecode(text);
            } catch (err) {
                alert(" Clipboard  permission  denied  or  clipboard  is  empty.  Please  paste  manually. ");
            }
        });

        // Listener 3: "Copy Modified Link" Button Logic
        copyBtn.addEventListener('click', async () => {
            if (outputField.value) {
                try {
                    await navigator.clipboard.writeText(outputField.value);
                    
                    // Tactile text change feedback
                    const originalText = copyBtn.innerText;
                    copyBtn.innerText = " Copied  Successfully! ";
                    
                    // Revert text after 2 seconds
                    setTimeout(() => {
                        copyBtn.innerText = originalText;
                    }, 2000);
                } catch (err) {
                    alert(" Failed  to  copy.  Please  copy  manually. ");
                }
            }
        });
    </script>
</body>
</html>
